services:
  frontend:
    image: frontend
    pull_policy: build
    build:
      context: ./frontend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - app_network

  backend:
    image: backend
    pull_policy: build
    build:
      context: ./backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./data/jobs_database.db:/app/data/jobs_database.db:rw
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
